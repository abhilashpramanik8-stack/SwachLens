<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">SwachhLens system architecture</title>
  <desc id="desc">Citizen and administrator Expo clients call an Express API. The API authenticates requests, stores JSON data and uploads, sends images to NVIDIA Vision, applies the waste playbook, matches specialty crews, calculates ETA, and returns status to the clients.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="api" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="ai" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0891b2"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity=".35"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,3 L0,6 z" fill="#94a3b8"/>
    </marker>
    <style>
      .title { font: 700 34px Arial, sans-serif; fill: #f8fafc; }
      .subtitle { font: 400 16px Arial, sans-serif; fill: #cbd5e1; }
      .label { font: 700 19px Arial, sans-serif; fill: #f8fafc; }
      .body { font: 400 15px Arial, sans-serif; fill: #dbeafe; }
      .small { font: 400 13px Arial, sans-serif; fill: #cbd5e1; }
      .edge { stroke: #94a3b8; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .edgeLabel { font: 600 13px Arial, sans-serif; fill: #e2e8f0; }
      .node { stroke: #475569; stroke-width: 1.5; filter: url(#shadow); }
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="80" y="72" class="title">SwachhLens · AI-assisted waste response</text>
  <text x="80" y="103" class="subtitle">Verified implementation architecture · Expo client · Express API · NVIDIA Vision · JSON persistence</text>

  <!-- edges first so they remain behind nodes -->
  <path class="edge" d="M300 250 C390 250 420 250 500 250"/>
  <path class="edge" d="M300 555 C390 555 420 310 500 310"/>
  <path class="edge" d="M700 250 C780 250 785 170 850 170"/>
  <path class="edge" d="M700 330 C780 330 790 300 850 300"/>
  <path class="edge" d="M700 410 C780 410 790 430 850 430"/>
  <path class="edge" d="M700 490 C785 490 800 560 850 560"/>
  <path class="edge" d="M1050 170 C1110 170 1110 230 1160 230"/>
  <path class="edge" d="M1050 300 C1110 300 1110 300 1160 300"/>
  <path class="edge" d="M1050 430 C1110 430 1110 370 1160 370"/>
  <path class="edge" d="M1050 560 C1110 560 1110 440 1160 440"/>
  <path class="edge" d="M1310 300 C1370 300 1370 300 1420 300"/>
  <path class="edge" d="M1310 420 C1370 420 1370 540 1420 540"/>
  <path class="edge" d="M1310 600 C1370 600 1370 675 1420 675"/>
  <path class="edge" d="M1420 365 C1370 365 1370 720 1310 720"/>
  <path class="edge" d="M1420 490 C1370 490 1370 780 1310 780"/>

  <g class="node">
    <rect x="80" y="170" width="220" height="155" rx="18" fill="#1e293b"/>
    <text x="105" y="212" class="label">Citizen app</text>
    <text x="105" y="244" class="body">Photo, description,</text>
    <text x="105" y="266" class="body">campus and GPS</text>
    <text x="105" y="298" class="small">Expo / React Native</text>
  </g>
  <g class="node">
    <rect x="80" y="475" width="220" height="155" rx="18" fill="#1e293b"/>
    <text x="105" y="517" class="label">Admin app</text>
    <text x="105" y="549" class="body">Queue, playbook,</text>
    <text x="105" y="571" class="body">crew and status control</text>
    <text x="105" y="603" class="small">JWT-protected routes</text>
  </g>
  <g class="node">
    <rect x="500" y="180" width="200" height="350" rx="22" fill="url(#api)" stroke="#a78bfa"/>
    <text x="532" y="225" class="label">Express API</text>
    <text x="532" y="266" class="body">Auth + validation</text>
    <text x="532" y="298" class="body">Upload pipeline</text>
    <text x="532" y="330" class="body">Issue lifecycle</text>
    <text x="532" y="362" class="body">Admin dashboard</text>
    <text x="532" y="394" class="body">JSON REST endpoints</text>
    <text x="532" y="455" class="small">backend/src/app.ts</text>
    <text x="532" y="479" class="small">TypeScript + Express</text>
  </g>

  <g class="node">
    <rect x="850" y="105" width="200" height="125" rx="18" fill="url(#ai)" stroke="#67e8f9"/>
    <text x="880" y="145" class="label">NVIDIA Vision</text>
    <text x="880" y="177" class="body">Image classification</text>
    <text x="880" y="201" class="small">One provider by design</text>
  </g>
  <g class="node">
    <rect x="850" y="245" width="200" height="125" rx="18" fill="#164e63" stroke="#67e8f9"/>
    <text x="883" y="285" class="label">Normalizer</text>
    <text x="880" y="317" class="body">Category, volume,</text>
    <text x="880" y="339" class="body">confidence, severity</text>
  </g>
  <g class="node">
    <rect x="850" y="385" width="200" height="125" rx="18" fill="#134e4a" stroke="#5eead4"/>
    <text x="888" y="425" class="label">Playbook</text>
    <text x="880" y="457" class="body">Actions + escalation</text>
    <text x="880" y="479" class="body">for each waste type</text>
  </g>
  <g class="node">
    <rect x="850" y="525" width="200" height="125" rx="18" fill="#134e4a" stroke="#5eead4"/>
    <text x="878" y="565" class="label">Crew matcher</text>
    <text x="880" y="597" class="body">Specialty + distance</text>
    <text x="880" y="619" class="body">ETA recommendation</text>
  </g>

  <g class="node">
    <rect x="1160" y="165" width="150" height="115" rx="18" fill="#312e81" stroke="#818cf8"/>
    <text x="1191" y="205" class="label">Fallback</text>
    <text x="1183" y="237" class="body">Text + image</text>
    <text x="1183" y="259" class="body">heuristics</text>
  </g>
  <g class="node">
    <rect x="1160" y="295" width="150" height="115" rx="18" fill="#312e81" stroke="#818cf8"/>
    <text x="1185" y="335" class="label">Dedup</text>
    <text x="1183" y="367" class="body">One active issue</text>
    <text x="1183" y="389" class="body">per campus</text>
  </g>
  <g class="node">
    <rect x="1160" y="425" width="150" height="115" rx="18" fill="#312e81" stroke="#818cf8"/>
    <text x="1185" y="465" class="label">ETA</text>
    <text x="1183" y="497" class="body">Campus distance</text>
    <text x="1183" y="519" class="body">+ response plan</text>
  </g>
  <g class="node">
    <rect x="1160" y="555" width="150" height="115" rx="18" fill="#312e81" stroke="#818cf8"/>
    <text x="1183" y="595" class="label">JSON store</text>
    <text x="1183" y="627" class="body">Users, issues,</text>
    <text x="1183" y="649" class="body">reports, crews</text>
  </g>
  <g class="node">
    <rect x="1420" y="240" width="120" height="120" rx="18" fill="#3f3f46" stroke="#a1a1aa"/>
    <text x="1447" y="280" class="label">Audit</text>
    <text x="1440" y="312" class="body">Events</text>
    <text x="1440" y="334" class="body">+ logs</text>
  </g>
  <g class="node">
    <rect x="1420" y="480" width="120" height="120" rx="18" fill="#3f3f46" stroke="#a1a1aa"/>
    <text x="1440" y="520" class="label">Uploads</text>
    <text x="1440" y="552" class="body">Images</text>
    <text x="1440" y="574" class="body">on disk</text>
  </g>
  <g class="node">
    <rect x="1420" y="640" width="120" height="120" rx="18" fill="#3f3f46" stroke="#a1a1aa"/>
    <text x="1440" y="680" class="label">Status</text>
    <text x="1440" y="712" class="body">reported →</text>
    <text x="1440" y="734" class="body">resolved</text>
  </g>

  <text x="80" y="845" class="small">Solid arrows show runtime data flow. The playbook is deterministic; NVIDIA provides the initial visual classification.</text>
</svg>
