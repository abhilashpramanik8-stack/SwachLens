services:
  backend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./backend:/app
    ports:
      - "5050:5050"
    command: sh -c "npm install && npm run dev"
    environment:
      PORT: 5050
      JWT_SECRET: change-me
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin123
